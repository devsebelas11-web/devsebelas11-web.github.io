<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Operasional - Kopi Kampus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0e5ec 0%, #b8c6db 100%);
            color: #333;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            box-sizing: border-box; /* Memastikan padding tidak melebihi lebar layar */
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
            padding-top: 10px;
        }
        .logo-container img {
            width: 70px;
            height: auto;
        }
        .nav {
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .nav a {
            color: #004d40;
            text-decoration: underline;
            margin: 0 5px;
            font-weight: bold;
        }
        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin: 20px 0;
        }
        h2.title-kedai {
            font-size: 20px;
            color: #222;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 14px;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #333;
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #f9f9f9;
        }
        .note {
            font-style: italic;
            font-size: 13px;
            color: #333;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Java -->
        <div class="logo-container">
            <img src="kopi.jpeg" alt="Logo Java">
        </div>

        <!-- Navigasi -->
        <div class="nav">
            <a href="index.html">Beranda</a> | <a href="jadwal.html">Jadwal Operasional</a>
        </div>

        <hr>

        <!-- Judul Jam Operasional -->
        <h2 class="title-kedai">Jam Operasional Kedai</h2>

        <!-- Tabel Jadwal -->
        <table>
            <tr>
                <th>Hari</th>
                <th>Jam Buka</th>
            </tr>
            <tr>
                <td>Senin -<br>Jumat</td>
                <td>09.00 -<br>22.00</td>
            </tr>
            <tr>
                <td>Sabtu -<br>Minggu</td>
                <td>10.00 -<br>24.00</td>
            </tr>
            <tr>
                <td colspan="2" class="note">
                    Format waktu dalam<br>WIB
                </td>
            </tr>
        </table>

        <!-- Footer -->
        <div class="footer">
            Created by Dev Herlino Pratama Ramadan @2026
        </div>
    </div>

</body>
</html>
